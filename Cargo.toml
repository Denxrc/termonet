[package]
name = "termonet"
version = "0.3.0"
edition = "2024"
authors = ["Denxrc <postoy07052010@gmail.com>"]
description = "Fast, dynamic Material You system theme and palette generator for Linux"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Denxrc/termonet"
keywords = ["material-you", "theme", "tui", "linux", "wayland"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.29.0"
directories = "6.0.0"
image = "0.25.10"
material-colors = { version = "0.5.0", features = ["quantize", "serde"] }
minijinja = { version = "3.0.5", features = ["serde"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.1"

# Optimize heavy image decoding and quantization dependencies even in dev builds
[profile.dev.package."*"]
opt-level = 3
